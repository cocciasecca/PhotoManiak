name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - edition: foss
            variant: Foss
          - edition: withCast
            variant: WithCast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:test${{ matrix.variant }}DebugUnitTest :app:lint${{ matrix.variant }}Debug :app:assemble${{ matrix.variant }}Debug
      - if: matrix.edition == 'foss'
        run: |
          ./gradlew :app:fossDependencyReport
          python3 scripts/check-foss-apk.py app/build/outputs/apk/foss/debug/app-foss-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoManiak-${{ matrix.edition }}
          path: app/build/outputs/apk/${{ matrix.edition }}/debug/*.apk
